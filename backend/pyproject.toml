[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeondome-backend"
version = "0.1.0"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["paho-mqtt>=2.1,<3", "jsonschema>=4.23", "psycopg[binary,pool]>=3.2", "fastapi>=0.162.0", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pre-commit", "types-jsonschema", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pigeondome = ["py.typed", "migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=pigeondome --cov-report=term-missing --tb=short"
testpaths = ["tests"]
