name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pigeon
          POSTGRES_PASSWORD: pigeon_ci
          POSTGRES_DB: pigeondome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pigeon -d pigeondome"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # credencial descartável de um banco efêmero que só existe durante o job
      PIGEONDOME_TEST_DSN: postgresql://pigeon:pigeon_ci@127.0.0.1:5432/pigeondome # gitleaks:allow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  simulator:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
