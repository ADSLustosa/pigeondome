version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(backend)" }
    groups:
      python-backend: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /simulator
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(simulator)" }
    groups:
      python-simulator: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(dashboard)" }
    groups:
      npm-dashboard: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    commit-message: { prefix: "build(infra)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
